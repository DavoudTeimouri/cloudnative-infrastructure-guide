<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Step 09 — Platform services · Cloud-Native Configurator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="module-header">
  <div class="step-nav" id="step-nav"></div>
  <h1>Step 09 — Platform services</h1>
  <p class="purpose">Make the platform observable and operated: monitoring, logging, GitOps, platform add-ons.</p>
  <p class="doc-link"><strong>Authoritative document:</strong> <a href="../../management-cluster/platform-services/">management-cluster/platform-services/</a></p>
</header>
<main>
  <form id="config-form" novalidate>
    <fieldset>
      <legend>Components</legend>
      <label><input type="checkbox" name="prometheus" checked> Prometheus + Alertmanager</label>
      <label><input type="checkbox" name="logging" checked> Central log shipping</label>
      <label><input type="checkbox" name="argocd" checked> Argo CD GitOps</label>
    </fieldset>

    <fieldset>
      <legend>Platform add-ons</legend>
      <label><input type="checkbox" name="harbor" checked> Harbor (image registry + scanning)</label>
      <label><input type="checkbox" name="nexus" checked> Nexus (artifact cache)</label>
      <label><input type="checkbox" name="gitlab" checked> GitLab (source + pipelines)</label>
      <label><input type="checkbox" name="velero" checked> Velero (backup to Ceph)</label>
    </fieldset>

    <fieldset>
      <legend>Scrape targets</legend>
      <label><input type="checkbox" name="scrapeKubelet" checked> kubelet</label>
      <label><input type="checkbox" name="scrapeCephMgr" checked> Ceph MGR :9283</label>
      <label><input type="checkbox" name="scrapeNode" checked> Node exporters</label>
      <label><input type="checkbox" name="scrapeEdge" checked> Edge load balancers</label>
    </fieldset>
  </form>

  <div id="validation" class="msg-box"></div>

  <div class="actions">
    <button type="button" id="validate">Validate</button>
    <button type="button" id="download">Download config (JSON)</button>
    <a class="btn-link" href="../../index.html">← Main site</a>
  </div>

  <pre id="config-output"></pre>
</main>
<script src="app.js"></script>
</body>
</html>
