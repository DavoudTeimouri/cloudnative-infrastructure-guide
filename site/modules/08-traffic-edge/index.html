<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 08 — Traffic edge · Cloud-Native Configurator</title>
<link rel="stylesheet" href="../../styles.css?v=3.4.0">
<link rel="stylesheet" href="../module.css?v=3.4.0">
</head>
<body>
<header class="module-header">
  <div class="step-nav" id="step-nav"></div>
  <h1>Step 08 — Traffic edge</h1>
  <p class="purpose">Client-facing entry: external load balancer, VIPs (Keepalived), HAProxy/Nginx, Kubernetes Ingress.</p>
  <p class="doc-link"><strong>Authoritative document:</strong> <a href="../../network-matrix/external-load-balancer.md">network-matrix/external-load-balancer.md</a></p>
</header>
<main>
  <form id="config-form" novalidate>
    <fieldset>
      <legend>Edge nodes</legend>
      <div class="field-row"><label>Edge host count (HA)</label><input type="number" name="edgeHosts" value="2" min="2"></div>
      <div class="field-row"><label>VIP address (dmz segment)</label><input type="text" name="vip" value="10.60.0.100"></div>
    </fieldset>

    <fieldset>
      <legend>Load balancer</legend>
      <label><input type="checkbox" name="haproxy" checked> HAProxy</label>
      <label><input type="checkbox" name="nginx" checked> Nginx</label>
      <label><input type="checkbox" name="keepalived" checked> Keepalived VIP failover</label>
    </fieldset>

    <fieldset>
      <legend>Ingress</legend>
      <div class="field-row"><label>Ingress controller</label><input type="text" name="ingressController" value="nginx"></div>
      <div class="field-row"><label>Hostname suffix</label><input type="text" name="hostnameSuffix" value="apps.internal"></div>
    </fieldset>

    <fieldset>
      <legend>MetalLB fallback</legend>
      <label><input type="checkbox" name="metallb" checked> MetalLB Layer 2 pool</label>
      <div class="field-row"><label>Address pool CIDR</label><input type="text" name="metallbPool" value="10.60.0.200/28"></div>
    </fieldset>
  </form>

  <div id="validation" class="msg-box"></div>

  <div class="actions">
    <button type="button" id="validate">Validate</button>
    <button type="button" id="download">Download config (JSON)</button>
    <a class="btn-link" href="../../index.html">← Main site</a>
  </div>

  <pre id="config-output"></pre>
</main>
<script src="app.js"></script>
</body>
</html>
