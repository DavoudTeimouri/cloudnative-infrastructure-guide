global
    log stdout format raw local0
    maxconn 20000
    tune.ssl.default-dh-param 2048
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    ssl-default-bind-ciphersuites ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites-default yes

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    timeout http-keep-alive 10s
    retries 3

# ---------------------------------------------------------------------------
# Stats page for the local management interface.
# Bind to the management address only. Never expose it on the DMZ address.
# ---------------------------------------------------------------------------
listen stats
    bind 10.60.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-node

# ---------------------------------------------------------------------------
# L4 edge to the L7 tier.
# The dataplane binds the wildcard address, not the VIP, so it keeps serving
# across a VRRP failover.
# ---------------------------------------------------------------------------
frontend fe_l4
    bind 0.0.0.0:443
    mode tcp
    default_backend be_l7

backend be_l7
    mode tcp
    balance leastconn
    option tcp-check
    server nginx_local 127.0.0.1:8443 check inter 3s fall 3 rise 2

# ---------------------------------------------------------------------------
# Kubernetes API endpoint. The edge is the stable address for kubectl, the
# Rancher agent, the Argo CD controller, and the CI runners.
# ---------------------------------------------------------------------------
frontend fe_api
    bind 0.0.0.0:6443
    mode tcp
    default_backend be_api

backend be_api
    mode tcp
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    server kube-apiserver 10.20.0.100:6443 check inter 3s fall 3 rise 2
