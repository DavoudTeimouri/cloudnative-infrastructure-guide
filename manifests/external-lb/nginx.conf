worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 32m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    upstream api_server {
        server 10.20.0.100:6443 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    upstream ingress_https {
        server 10.61.0.10:443 max_fails=2 fail_timeout=5s;
        server 10.61.0.11:443 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80 reuseport;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Edge TLS termination and L7 policy
    server {
        listen 443 ssl reuseport;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        location / {
            proxy_pass http://ingress_https;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }

    # Local health endpoint for the keepalived check and for monitoring.
    server {
        listen 8443 reuseport;
        server_name _;
        access_log off;
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
        location / {
            return 404;
        }
    }
}
