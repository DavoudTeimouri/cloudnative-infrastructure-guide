global_defs {
    router_id lb-node-1
    enable_script_security
    script_user root
    vrrp_skip_check_adv_addr
}

# Health check on the local dataplane. A failed check lowers the effective
# priority so this node does not take the VIP.
vrrp_script chk_haproxy {
    script "/etc/keepalived/keepalived.d/check_haproxy.sh"
    interval 2
    weight -20
    fall 2
    rise 2
}

vrrp_instance VI_EDGE {
    state BACKUP
    interface bond0
    virtual_router_id 51
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass <from Vault, rendered by Ansible>
    }

    # Unicast peers. VRRP multicast (224.0.0.18) is filtered on most
    # switched DMZ segments; confirm with the network team before using it.
    unicast_src_ip 10.60.0.1
    unicast_peer {
        10.60.0.2
    }

    virtual_ipaddress {
        10.60.0.10/24
    }

    track_script {
        chk_haproxy
    }

    notify_master "/etc/keepalived/keepalived.d/notify.sh MASTER"
    notify_backup "/etc/keepalived/keepalived.d/notify.sh BACKUP"
    notify_fault  "/etc/keepalived/keepalived.d/notify.sh FAULT"
}
